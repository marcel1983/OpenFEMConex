# Builds the application for Linux, Windows and macOS and runs the fast tests.
# Runs on demand or on version tags; on a tag the archives are attached to the
# GitHub release of that tag (created if it does not exist yet).
name: package
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: CalculiX (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y calculix-ccx libxcb-cursor0 libegl1 libglu1-mesa libxrender1 libxcursor1 libxft2 libxinerama1
      - name: CalculiX (Windows and macOS, conda-forge)
        if: runner.os != 'Linux'
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: ccx
          # OpenBLAS instead of MKL keeps the bundled DLLs small
          create-args: calculix libblas=*=*openblas
          init-shell: none
      - name: Locate ccx (Windows and macOS)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          ccx=$(find "$MAMBA_ROOT_PREFIX/envs/ccx" \( -iname 'ccx' -o -iname 'ccx*.exe' -o -iname 'ccx_*' \) -type f | head -1)
          echo "found: $ccx"
          test -n "$ccx"
          echo "OPENFEMCONEX_CCX=$ccx" >> "$GITHUB_ENV"
          # let PyInstaller find the DLLs ccx needs (ARPACK, BLAS) next to it
          dirname "$ccx" >> "$GITHUB_PATH"
          # conda-forge on Windows keeps ARPACK and the gfortran runtime here
          if [ -d "$(dirname "$ccx")/../mingw-w64/bin" ]; then
            (cd "$(dirname "$ccx")/../mingw-w64/bin" && pwd -W 2>/dev/null || pwd) >> "$GITHUB_PATH"
          fi
          ls "$(dirname "$ccx")" | grep -i -E "arpack|blas|lapack|spooles|gfortran|quadmath" || true
      - name: Check that ccx runs (Windows and macOS)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          mkdir -p ccxcheck && cd ccxcheck
          printf '*NODE\n1,0,0,0\n2,1,0,0\n*ELEMENT,TYPE=T3D2,ELSET=E\n1,1,2\n*MATERIAL,NAME=S\n*ELASTIC\n2.1e5,0.3\n*SOLID SECTION,ELSET=E,MATERIAL=S\n1.\n*BOUNDARY\n1,1,3\n2,2,3\n*STEP\n*STATIC\n*CLOAD\n2,1,10.\n*NODE PRINT,NSET=Nall\nU\n*END STEP\n' > t.inp
          "$OPENFEMCONEX_CCX" -i t | tee ccx.log
          grep -q "Job finished" ccx.log
      - name: Install
        run: python -m pip install ".[gui,dev,package]"
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -m "not ccx"
      - name: Build
        run: pyinstaller --noconfirm packaging/openfemconex.spec
      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: tar -czf openfemconex-linux-x86_64.tar.gz -C dist openfemconex
      - name: Archive (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/OpenFEMConex.app openfemconex-macos-arm64.zip
      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/openfemconex -DestinationPath openfemconex-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: openfemconex-${{ runner.os }}
          path: openfemconex-*.*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --prerelease --title "$TAG" --notes ""
          gh release upload "$TAG" assets/* -R "$GITHUB_REPOSITORY" --clobber
