[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openfemconex"
version = "0.7.1"
description = "Conexiones metálicas por elementos finitos (CalculiX) según AISC y ACI"
readme = "README.md"
license = {text = "AGPL-3.0-or-later"}
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "gmsh>=4.12",
    "python-docx>=1.1",
    "openconex @ git+https://github.com/marcel1983/openconex.git",
]

[project.optional-dependencies]
gui = ["PySide6>=6.8", "pyvista>=0.44", "pyvistaqt>=0.11"]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.6"]
package = ["pyinstaller>=6.10"]

[project.scripts]
openfemconex = "openfemconex.cli:main"

[project.gui-scripts]
openfemconex-gui = "openfemconex.gui.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"openfemconex.help" = ["es/*.md", "en/*.md", "img/*/*.png"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ccx: corre CalculiX (lento); se omite si ccx no está instalado"]
