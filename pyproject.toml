[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openfemconex"
version = "0.1.0"
description = "Conexiones metálicas por elementos finitos (CalculiX) según AISC y ACI"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "gmsh>=4.12",
    "openconex>=0.5.20",
]

[project.optional-dependencies]
gui = ["PySide6>=6.8", "pyvista>=0.44", "pyvistaqt>=0.11"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
openfemconex = "openfemconex.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ccx: corre CalculiX (lento); se omite si ccx no está instalado"]
